# Deployment without a build on the NAS: `yarn build` runs on the dev machine, the resulting
# `.output/` is copied to /volume1/docker/auction-grabber, and this stack only runs it.
services:
  auction-grabber:
    image: node:24-alpine
    container_name: auction_grabber_app
    working_dir: /app
    command: node .output/server/index.mjs
    volumes:
      # Read-only: the container runs the build, it never writes into it.
      - /volume1/docker/auction-grabber/.output:/app/.output:ro
      # The only writable path — survives every redeploy of .output.
      - /volume1/docker/auction-grabber/data:/app/data
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Without this Nitro binds to localhost inside the container and the port mapping stays dead.
      - HOST=0.0.0.0
      # Court dates are local time — the container would otherwise run on UTC.
      - TZ=Europe/Berlin
      - AUCTION_DATA_FILE=/app/data/auctions.json
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/auctions').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
